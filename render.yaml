# render.yaml - Chatwoot completo para Render

services:
  - type: web
    name: chatwoot
    env: docker
    plan: free
    branch: develop
    rootDirectory: /
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_URL
        value: https://tu-subdominio.onrender.com
      - key: SECRET_KEY_BASE
        generateValue: true
      # Redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      # PostgreSQL
      - key: POSTGRES_HOST
        fromDatabase:
          name: chatwoot-db
          property: host
      - key: POSTGRES_USERNAME
        fromDatabase:
          name: chatwoot-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: chatwoot-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: chatwoot-db
          property: database
      # SMTP / Email (requerido por Chatwoot)
      - key: MAILER_SENDER_EMAIL
        value: "tu-email@dominio.com"
      - key: SMTP_ADDRESS
        value: "smtp.dominio.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "usuario-smtp"
      - key: SMTP_PASSWORD
        value: "contraseña-smtp"
      - key: SMTP_AUTHENTICATION
        value: "plain"
      - key: SMTP_ENABLE_STARTTLS_AUTO
        value: "true"

  - type: redis
    name: chatwoot-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections from Render internal network

databases:
  - name: chatwoot-db
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections from Render internal network
