services:
  - type: web
    name: chatwoot
    env: docker
    plan: free
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_URL
        value: https://tu-subdominio.onrender.com
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: REDIS_URL
        fromService: redis
      - key: POSTGRES_HOST
        fromDatabase: chatwoot-db
      - key: POSTGRES_USERNAME
        fromDatabase: chatwoot-db
      - key: POSTGRES_PASSWORD
        fromDatabase: chatwoot-db
      - key: POSTGRES_DB
        fromDatabase: chatwoot-db

  - type: redis
    name: redis
    plan: free

databases:
  - name: chatwoot-db
    plan: free
